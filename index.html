<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cntrl+Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07070c; --fg:#e8e8ee; --accent:#ff2d55; --muted:#9a9aaa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: "Courier New", monospace; min-height:100vh; }

  /* Capas de fondo y efectos */
  #fondo { position:fixed; inset:0; width:100%; height:100%; z-index:-1; }
  #rotura { position:fixed; inset:0; width:100%; height:100%; z-index:50; pointer-events:none; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60; }

  #sonido { position:fixed; top:12px; right:12px; z-index:5; background:rgba(21,21,28,.85); color:var(--fg); border:1px solid #2a2a36; border-radius:50%; width:40px; height:40px; padding:0; font-size:1.1rem; }

  main { max-width:720px; margin:0 auto; padding:48px 20px 80px; }
  h1 { margin:0 0 10px; text-align:center; line-height:0; }
  #titulo { display:block; margin:0 auto; max-width:100%; height:auto; }
  .subtitulo { font-family:"Cinzel", Georgia, serif; font-weight:700; font-size:clamp(1.05rem,3.6vw,1.5rem); letter-spacing:.12em; color:#fff; text-align:center; margin:0 0 40px; text-shadow:0 2px 10px #000; }

  label { display:block; margin-bottom:12px; padding:14px 18px; font-size:clamp(1.15rem,4.2vw,1.45rem); line-height:1.35; color:#fff; background:rgba(0,0,0,.75); border:1px solid #2a2a36; border-radius:8px; }
  textarea { width:100%; min-height:140px; padding:14px; background:rgba(21,21,28,.93); color:var(--fg); border:1px solid #2a2a36; border-radius:8px; font:inherit; resize:vertical; }
  textarea:focus { outline:2px solid var(--accent); }
  .hint { font-size:.8rem; color:#b8b8c8; margin-top:6px; text-shadow:0 1px 6px #000; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:12px 22px; }
  #borrar { margin-top:16px; background:var(--accent); color:#fff; font-weight:bold; }
  #borrar:disabled { opacity:.5; cursor:not-allowed; }

  /* Ventanas emergentes */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:10; padding:20px; }
  .overlay.show { display:flex; }
  .box { background:#15151c; border:1px solid #2a2a36; border-radius:12px; padding:40px 30px; text-align:center; max-width:560px; width:100%; }
  .box h2 { margin:0 0 20px; }
  .box button { background:#2a2a36; color:var(--fg); }

  /* Cargando + barra */
  .barra { height:10px; background:#0b0b10; border:1px solid #2a2a36; border-radius:6px; overflow:hidden; }
  .barra i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ff2d55,#ffe600,#00e5ff); }

  /* Error */
  .box.error { border-color:var(--accent); }
  .box.error h2 { font-family:"Cinzel", Georgia, serif; font-weight:900; text-transform:uppercase; letter-spacing:.04em; font-size:clamp(1.6rem,6.2vw,2.5rem); color:var(--accent); margin:0 0 28px; line-height:1.2; }

  /* Mundo real */
  .box.mundo .cara { font-size:5rem; line-height:1; margin-bottom:12px; }
  .box.mundo p { font-size:1.2rem; line-height:1.5; margin:0 0 26px; }

  /* Glitch de pantalla */
  body.glitch main { animation: shake .12s infinite, hue .2s steps(2) infinite; }
  body.glitch::before { content:""; position:fixed; inset:0; z-index:20; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(255,0,80,.18) 0 3px, rgba(0,255,255,.15) 3px 6px);
    mix-blend-mode:screen; animation: flick .1s infinite; }
  body.quebrar main { animation: shake .07s 8; }
  @keyframes shake { 0%{transform:translate(0,0)} 25%{transform:translate(-8px,3px) skewX(4deg)} 50%{transform:translate(6px,-4px)} 75%{transform:translate(-5px,-2px) skewX(-5deg)} 100%{transform:translate(4px,5px)} }
  @keyframes hue { 0%{filter:hue-rotate(0) contrast(1.4)} 100%{filter:hue-rotate(160deg) contrast(2) invert(.1)} }
  @keyframes flick { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:.8} }

  /* Listado */
  #archivo { display:none; margin-top:56px; }
  #archivo.show { display:block; }
  #archivo h2 { border-bottom:1px solid #2a2a36; padding-bottom:10px; margin-bottom:6px; text-shadow:0 1px 6px #000; }
  #archivo .sub { font-size:.8rem; color:#b8b8c8; margin:0 0 14px; text-shadow:0 1px 6px #000; }
  #lista { list-style:none; padding:0; margin:0; }
  #lista li { background:#15151c; border-left:3px solid var(--accent); padding:14px; margin:12px 0; border-radius:6px; white-space:pre-wrap; word-break:break-word; }
  #lista small { display:block; color:var(--muted); margin-top:8px; }

  .final { text-align:center; margin-top:48px; }
  #mundo { background:transparent; color:var(--fg); border:1px solid var(--fg); }
  #mundo:hover { background:var(--fg); color:#07070c; }
</style>
</head>
<body>
<canvas id="fondo"></canvas>
<canvas id="rotura"></canvas>
<div id="flash"></div>
<button id="sonido" aria-label="Activar o silenciar sonido">🔊</button>

<main>
  <h1 aria-label="Cntrl+Z"><canvas id="titulo" width="640" height="160" role="img" aria-label="Cntrl+Z"></canvas></h1>
  <p class="subtitulo">Máquina para borrar recuerdos</p>

  <label for="recuerdo">Algo que desearía no haber visto en Internet...</label>
  <textarea id="recuerdo" maxlength="500" placeholder="Un meme, una creepypasta, un video, una funa..."></textarea>
  <div class="hint">Máximo 500 caracteres.</div>
  <button id="borrar">Eliminar recuerdos</button>

  <section id="archivo">
    <h2>ARCHIVO DE COSAS "NO" ELIMINADAS DE LA MEMORIA</h2>
    <p class="sub">Somos humanos, no máquinas</p>
    <ul id="lista"></ul>
    <div class="final"><button id="mundo">Volver al mundo real</button></div>
  </section>
</main>

<div class="overlay" id="cargando">
  <div class="box">
    <h2>Cargando...</h2>
    <div class="barra"><i id="progreso"></i></div>
  </div>
</div>

<div class="overlay" id="error">
  <div class="box error">
    <h2>ERROR, RECUERDO NO ELIMINADO</h2>
    <button id="cerrar">Cerrar</button>
  </div>
</div>

<div class="overlay" id="realidad">
  <div class="box mundo">
    <div class="cara">:)</div>
    <p>Adelante, bloquea el celular y ve a crear recuerdos nuevos</p>
    <button id="aceptar">Aceptar</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, limit, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjdCOyndtLnEHrwQ4xrEGqzIXuLZinJOA",
    authDomain: "cntrlz-98b09.firebaseapp.com",
    projectId: "cntrlz-98b09",
    storageBucket: "cntrlz-98b09.firebasestorage.app",
    messagingSenderId: "769377891822",
    appId: "1:769377891822:web:af3de9b401db94e2fd8aff"
  };

  const db = getFirestore(initializeApp(firebaseConfig));
  const col = collection(db, "recuerdos");

  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const paleta = ["#ff2d55", "#00e5ff", "#ffe600", "#7c4dff", "#00ff9d", "#ff6bd6", "#ffffff"];
  const elegir = () => paleta[Math.floor(Math.random() * paleta.length)];

  /* =========================================================
     TÍTULO: Cntrl+Z hecho de píxeles de colores
  ========================================================= */
  async function titulo() {
    try {
      await Promise.race([
        document.fonts.load('900 100px "Playfair Display"'),
        new Promise(r => setTimeout(r, 3000))
      ]);
    } catch (e) {}
    const cv = $("titulo"), ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height, celda = 5;
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const o = off.getContext("2d");
    const txt = "Cntrl+Z";
    let fs = 100;
    o.font = `900 ${fs}px "Playfair Display", Georgia, serif`;
    fs = Math.floor(fs * (W - 24) / o.measureText(txt).width);
    o.font = `900 ${fs}px "Playfair Display", Georgia, serif`;
    o.textAlign = "center";
    const m = o.measureText(txt);
    o.fillStyle = "#000";
    o.fillText(txt, W / 2, (H + m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
    const datos = o.getImageData(0, 0, W, H).data;
    const celdas = [];
    for (let y = 0; y < Math.floor(H / celda); y++) {
      for (let x = 0; x < Math.floor(W / celda); x++) {
        const px = x * celda + 2, py = y * celda + 2;
        if (datos[(py * W + px) * 4 + 3] > 128) celdas.push({ x, y, c: elegir() });
      }
    }
    let filaGlitch = -1, desvio = 0;
    function pintar() {
      ctx.clearRect(0, 0, W, H);
      for (const c of celdas) {
        ctx.fillStyle = c.c;
        const dx = c.y === filaGlitch ? desvio : 0;
        ctx.fillRect(c.x * celda + dx, c.y * celda, celda - 1, celda - 1);
      }
    }
    pintar();
    if (!reducido) {
      setInterval(() => {
        if (document.hidden) return;
        for (const c of celdas) if (Math.random() < .07) c.c = elegir();
        if (Math.random() < .12) {
          filaGlitch = Math.floor(rnd(0, H / celda));
          desvio = (Math.random() < .5 ? -1 : 1) * celda * Math.floor(rnd(1, 4));
        } else filaGlitch = -1;
        pintar();
      }, 120);
    }
  }
  titulo();

  /* =========================================================
     FONDO: pantalla rota con glitches de colores
  ========================================================= */
  const fondo = $("fondo"), fc = fondo.getContext("2d");
  const capa = document.createElement("canvas");
  let intenso = false, bloques = [], timerFondo;

  function trazar(g, pts, off, color, lw) {
    g.beginPath(); g.strokeStyle = color; g.lineWidth = lw;
    pts.forEach((p, i) => i ? g.lineTo(p[0] + off, p[1]) : g.moveTo(p[0] + off, p[1]));
    g.stroke();
  }
  function dibujarGrieta(g, pts) {
    trazar(g, pts, -1.5, "rgba(0,229,255,.22)", 1);
    trazar(g, pts, 1.5, "rgba(255,45,85,.22)", 1);
    trazar(g, pts, 0, "rgba(255,255,255,.3)", 1);
  }
  function ramaFondo(g, x, y, ang) {
    const pts = [[x, y]];
    let rec = 0, largo = rnd(60, 200), px = x, py = y;
    while (rec < largo) {
      const seg = rnd(14, 50); ang += rnd(-.4, .4);
      px += Math.cos(ang) * seg; py += Math.sin(ang) * seg; rec += seg; pts.push([px, py]);
    }
    dibujarGrieta(g, pts);
  }
  function grietaFondo(g, x, y, W, H) {
    const rayos = Math.floor(rnd(9, 14)), max = Math.max(W, H);
    for (let i = 0; i < rayos; i++) {
      let ang = i / rayos * Math.PI * 2 + rnd(-.2, .2), px = x, py = y, rec = 0;
      const largo = rnd(.2, .65) * max, pts = [[x, y]];
      while (rec < largo) {
        const seg = rnd(18, 70); ang += rnd(-.35, .35);
        px += Math.cos(ang) * seg; py += Math.sin(ang) * seg; rec += seg; pts.push([px, py]);
        if (Math.random() < .12) ramaFondo(g, px, py, ang + (Math.random() < .5 ? -1 : 1) * rnd(.6, 1.1));
      }
      dibujarGrieta(g, pts);
    }
    for (let r = 60; r < max * .35; r += rnd(70, 130)) {
      const pts = [], n = 22;
      for (let k = 0; k <= n; k++) {
        const a = k / n * Math.PI * 2, rr = r * rnd(.85, 1.15);
        pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
      }
      trazar(g, pts, 0, "rgba(255,255,255,.14)", 1);
    }
  }
  function nuevosBloques() {
    const W = fondo.width, H = fondo.height, n = intenso ? 45 : 7;
    bloques = [];
    for (let i = 0; i < n; i++) {
      const col = elegir(), a = intenso ? rnd(.18, .4) : rnd(.05, .13);
      if (Math.random() < .5) {
        bloques.push({ x: rnd(0, W), y: rnd(0, H), w: rnd(80, 420), h: rnd(3, 12), col, a });
      } else {
        const s = 16, bx = Math.floor(rnd(0, W / s)) * s, by = Math.floor(rnd(0, H / s)) * s;
        const cnt = Math.floor(rnd(2, 7));
        for (let j = 0; j < cnt; j++) {
          bloques.push({ x: bx + Math.floor(rnd(-2, 3)) * s, y: by + Math.floor(rnd(-2, 3)) * s, w: s, h: s, col, a });
        }
      }
    }
  }
  function pintarFondo() {
    fc.globalAlpha = 1;
    fc.fillStyle = "#07070c";
    fc.fillRect(0, 0, fondo.width, fondo.height);
    fc.drawImage(capa, 0, 0);
    for (const b of bloques) {
      fc.globalAlpha = b.a; fc.fillStyle = b.col;
      fc.fillRect(b.x, b.y, b.w, b.h);
    }
    fc.globalAlpha = 1;
  }
  function ciclo() {
    if (!document.hidden) { nuevosBloques(); pintarFondo(); }
    timerFondo = setTimeout(ciclo, intenso ? 70 : 450);
  }
  function setIntenso(v) {
    intenso = v;
    nuevosBloques(); pintarFondo();
    clearTimeout(timerFondo);
    if (!reducido) timerFondo = setTimeout(ciclo, intenso ? 70 : 450);
  }
  function generarFondo() {
    const W = fondo.width = innerWidth, H = fondo.height = innerHeight;
    capa.width = W; capa.height = H;
    const g = capa.getContext("2d");
    [[.22, .28], [.78, .7], [.55, .1]].forEach(([a, b]) =>
      grietaFondo(g, W * a + rnd(-30, 30), H * b + rnd(-30, 30), W, H));
    nuevosBloques(); pintarFondo();
  }
  generarFondo();
  if (!reducido) timerFondo = setTimeout(ciclo, 450);
  let tResize;
  addEventListener("resize", () => { clearTimeout(tResize); tResize = setTimeout(generarFondo, 250); });

  /* =========================================================
     SONIDOS (generados con Web Audio, sin archivos)
  ========================================================= */
  let ac = null, maestro = null, silencio = false, bufRuido = null;
  function audio() {
    if (silencio) return null;
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        maestro = ac.createGain(); maestro.gain.value = .6; maestro.connect(ac.destination);
        bufRuido = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = bufRuido.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { return null; }
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function rafaga(c, t, dur, tipo, freq, vol, q = 1) {
    const s = c.createBufferSource(); s.buffer = bufRuido;
    const f = c.createBiquadFilter(); f.type = tipo; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(maestro);
    s.start(t, rnd(0, 1.5), dur + .02);
  }
  function tono(c, t, dur, tipo, f1, f2, vol) {
    const o = c.createOscillator(); o.type = tipo;
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(maestro);
    o.start(t); o.stop(t + dur + .02);
  }
  function sonidoTecla() {
    const c = audio(); if (!c) return;
    const t = c.currentTime;
    rafaga(c, t, .045, "bandpass", rnd(1800, 3200), .45, 1.2);
    tono(c, t, .05, "triangle", rnd(160, 220), 90, .2);
  }
  function sonidoEnviado() {
    const c = audio(); if (!c) return;
    const t = c.currentTime;
    tono(c, t, .2, "sine", 380, 1400, .25);
    tono(c, t + .17, .3, "triangle", 880, null, .22);
    tono(c, t + .27, .4, "triangle", 1320, null, .2);
  }
  function sonidoGlitch(dur) {
    const c = audio(); if (!c) return;
    const t = c.currentTime;
    for (let i = 0; i < 28; i++) {
      const st = t + rnd(0, dur - .1), d = rnd(.02, .09), f = rnd(80, 2400);
      const o = c.createOscillator(); o.type = Math.random() < .5 ? "square" : "sawtooth";
      o.frequency.setValueAtTime(f, st);
      o.frequency.setValueAtTime(f * rnd(.3, 3), st + d / 2);
      const g = c.createGain();
      g.gain.setValueAtTime(.12, st); g.gain.linearRampToValueAtTime(0, st + d);
      o.connect(g); g.connect(maestro);
      o.start(st); o.stop(st + d + .01);
    }
    for (let i = 0; i < 14; i++) {
      rafaga(c, t + rnd(0, dur - .15), rnd(.03, .12), "bandpass", rnd(1000, 6000), .3, 2);
    }
    const z = c.createOscillator(); z.type = "sawtooth"; z.frequency.value = 55;
    const gz = c.createGain();
    gz.gain.setValueAtTime(.09, t); gz.gain.linearRampToValueAtTime(0, t + dur);
    z.connect(gz); gz.connect(maestro); z.start(t); z.stop(t + dur);
  }
  function sonidoRotura() {
    const c = audio(); if (!c) return;
    const t = c.currentTime;
    rafaga(c, t, .28, "highpass", 1500, .9);
    rafaga(c, t, .18, "lowpass", 400, 1);
    tono(c, t, .35, "sine", 120, 40, .7);
    for (let i = 0; i < 10; i++) rafaga(c, t + rnd(.03, .6), .04, "bandpass", rnd(3000, 7000), .35, 3);
    for (let i = 0; i < 35; i++) {
      tono(c, t + rnd(.1, 1.7), rnd(.08, .25), Math.random() < .5 ? "sine" : "triangle", rnd(2500, 9000), null, rnd(.05, .12));
    }
  }
  const btnSonido = $("sonido");
  btnSonido.addEventListener("click", () => {
    silencio = !silencio;
    btnSonido.textContent = silencio ? "🔇" : "🔊";
  });

  /* =========================================================
     PANTALLA QUE SE ROMPE
  ========================================================= */
  function romperPantalla(x, y) {
    const cv = $("rotura"), g = cv.getContext("2d");
    const W = cv.width = innerWidth, H = cv.height = innerHeight;
    cv.style.transition = "none"; cv.style.opacity = "1";
    const fl = $("flash");
    fl.style.transition = "none"; fl.style.opacity = ".9";
    setTimeout(() => { fl.style.transition = "opacity .5s"; fl.style.opacity = "0"; }, 30);
    document.body.classList.add("quebrar");
    setTimeout(() => document.body.classList.remove("quebrar"), 700);
    sonidoRotura();

    const maxD = Math.hypot(W, H) * 1.05, N = 16;
    const rayos = [];
    for (let i = 0; i < N; i++) {
      let ang = i / N * Math.PI * 2 + rnd(-.15, .15), px = x, py = y, rec = 0;
      const pts = [[x, y]];
      while (rec < maxD) {
        const seg = rnd(25, 65); ang += rnd(-.3, .3);
        px += Math.cos(ang) * seg; py += Math.sin(ang) * seg; rec += seg; pts.push([px, py]);
      }
      rayos.push(pts);
    }
    const maxLen = Math.max(...rayos.map(r => r.length));
    const anillos = [];
    for (let k = 3; k < maxLen; k += 3) anillos.push(k);
    const trozos = [];
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      for (let a = 0; a < anillos.length - 1; a++) {
        if (Math.random() < .4) {
          trozos.push({ i, j, ka: anillos[a], kb: anillos[a + 1],
            col: Math.random() < .5 ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.25)" });
        }
      }
    }
    const dur = 800, t0 = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      const vis = e * maxLen;
      g.clearRect(0, 0, W, H);
      for (const z of trozos) {
        const A = rayos[z.i], B = rayos[z.j];
        if (z.kb > vis || z.kb >= A.length || z.kb >= B.length) continue;
        g.beginPath();
        g.moveTo(A[z.ka][0], A[z.ka][1]); g.lineTo(A[z.kb][0], A[z.kb][1]);
        g.lineTo(B[z.kb][0], B[z.kb][1]); g.lineTo(B[z.ka][0], B[z.ka][1]);
        g.closePath(); g.fillStyle = z.col; g.fill();
      }
      for (const r of rayos) {
        const n = Math.min(r.length - 1, Math.floor(vis));
        if (n < 1) continue;
        const parte = r.slice(0, n + 1);
        trazar(g, parte, -2, "rgba(0,229,255,.5)", 1.5);
        trazar(g, parte, 2, "rgba(255,45,85,.5)", 1.5);
        trazar(g, parte, 0, "rgba(255,255,255,.95)", 2.2);
      }
      for (const k of anillos) {
        if (k > vis) break;
        g.beginPath(); g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 1.2;
        let abierto = false;
        for (let i = 0; i <= N; i++) {
          const r = rayos[i % N];
          if (k < r.length) {
            if (!abierto) { g.moveTo(r[k][0], r[k][1]); abierto = true; } else g.lineTo(r[k][0], r[k][1]);
          } else abierto = false;
        }
        g.stroke();
      }
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    setTimeout(() => { cv.style.transition = "opacity 1.2s"; cv.style.opacity = "0"; }, 4000);
    setTimeout(() => g.clearRect(0, 0, W, H), 5400);
  }

  /* =========================================================
     FLUJO PRINCIPAL
  ========================================================= */
  const texto = $("recuerdo"), btn = $("borrar");
  let pendiente = "";
  let escuchando = false;

  texto.addEventListener("input", sonidoTecla);

  btn.addEventListener("click", () => {
    const valor = texto.value.trim();
    if (!valor) { texto.focus(); return; }
    pendiente = valor;
    btn.disabled = true;
    sonidoEnviado();

    const barra = $("progreso");
    barra.style.transition = "none"; barra.style.width = "0%";
    $("cargando").classList.add("show");
    setTimeout(() => { barra.style.transition = "width 2s linear"; barra.style.width = "100%"; }, 50);

    setTimeout(() => {                         // 2 segundos de "Cargando..."
      $("cargando").classList.remove("show");
      document.body.classList.add("glitch");
      setIntenso(true);
      sonidoGlitch(1.5);
      setTimeout(() => {
        document.body.classList.remove("glitch");
        setIntenso(false);
        $("error").classList.add("show");
      }, 1500);
    }, 2000);
  });

  $("cerrar").addEventListener("click", async () => {
    $("error").classList.remove("show");
    try {
      await addDoc(col, { texto: pendiente.slice(0, 500), fecha: serverTimestamp() });
    } catch (e) { console.error(e); }
    texto.value = "";
    pendiente = "";
    btn.disabled = false;
    $("archivo").classList.add("show");
    escuchar();
    $("archivo").scrollIntoView({ behavior: "smooth" });
  });

  $("mundo").addEventListener("click", () => $("realidad").classList.add("show"));

  $("aceptar").addEventListener("click", () => {
    const r = $("aceptar").getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    $("realidad").classList.remove("show");
    romperPantalla(x, y);
  });

  function escuchar() {
    if (escuchando) return;
    escuchando = true;
    const q = query(col, orderBy("fecha", "desc"), limit(100));
    onSnapshot(q, snap => {
      const ul = $("lista");
      ul.innerHTML = "";
      snap.forEach(d => {
        const { texto, fecha } = d.data();
        const li = document.createElement("li");
        li.textContent = texto;
        const small = document.createElement("small");
        small.textContent = fecha ? fecha.toDate().toLocaleString("es-MX") : "ahora";
        li.appendChild(small);
        ul.appendChild(li);
      });
    });
  }
</script>
</body>
